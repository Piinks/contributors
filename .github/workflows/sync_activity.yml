name: Daily Activity Sync

on:
  schedule:
    # Run daily at 02:17 UTC (offset from top of hour to avoid high-load queue drops)
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days of activity to sync'
        type: string
        required: false
        default: '7'
      week:
        description: 'Optional specific ISO week to sync (e.g. 2026-W32)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-activity
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Contributor Activity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1

      - name: Install dependencies
        run: dart pub get

      - name: Run activity sync
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days || '7' }}
          WEEK: ${{ inputs.week || '' }}
        run: |
          if [ -n "$WEEK" ]; then
            dart run tool/sync_activity.dart --week "$WEEK"
          else
            dart run tool/sync_activity.dart --days "$DAYS"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activity/ data/activity_summary.json
          if git diff --staged --quiet; then
            echo "No activity changes to commit."
          else
            git commit -m "chore: sync contributor activity data [skip ci]"
            git pull --rebase || true
            git push
          fi
